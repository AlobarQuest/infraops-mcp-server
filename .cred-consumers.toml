# .cred-consumers.toml — consumer inventory for credentials the WS-0.7 rotation
# lane manages from this repo. Complements .bws-secrets.toml: that file declares
# which secrets this repo CONSUMES; this file answers, per managed credential,
# "if this credential is rotated, what must be updated and verified?"
#
# FAIL-SAFE (spec decision 1): the rotation lane REFUSES to revoke any credential
# whose consumer set here is not attested (`consumers_verified` date set by a
# fingerprint sweep). Values NEVER appear here — identity is sha256[:8] only.
#
# Consumer kinds the executor can DEPLOY to (src/security-drift/cred-rotation.ts
# SUPPORTED_CONSUMER_KINDS — any other kind forces the credential to the manual lane):
#   bws-secret        { uuid }                              — keeper storage in BWS
#   keychain          { service, account }                  — macOS login Keychain item
#   coolify-env       { instance, resource_type, uuid, key, redeploy } — app/service env
#   gh-actions-secret { repo, name }                        — write-only; deploy via `gh secret set`
# Declarative-only kinds (documented consumers, NOT executor-deployable — their
# presence keeps the credential manual-lane by design):
#   shell-export      { file, var }                         — literal export line in a shell file
#   runtime-fetch     { repo, ref }                         — code fetches from BWS by UUID at runtime
#   coolify-env-hash  { instance, resource_type, uuid, key, entry } — env holds sha256(credential),
#                                                           not the value (orchestrator M2M map); a
#                                                           raw deploy there would break auth.
#                                                           `entry` is the key id inside the JSON
#                                                           the credential's hash sits under; the
#                                                           SDS rotation executor rewrites only that
#                                                           entry (orchestrator ADR-0055 am. 9)
#
# Sibling registries (spec decision 1 — each credential lives in its OWNING repo's file):
# orchestrator (its M2M bearers + the sds-operator BWS token), change-manager (its M2M bearers),
# factory-runner (FACTORY_PR_TOKEN). Every credential id must be unique across all files.
# Syntax note: this file is parsed by a strict SUBSET parser — single-line values
# only (arrays must open and close on one line; array items split on commas).
#
# On-demand rotation: add `rotate_requested = "YYYY-MM-DD"` (a quoted real date, UTC)
# to a [[credential]] to raise cred.rotation-requested from that date, before the
# credential is due. A malformed value raises cred.invalid-rotate-requested for that
# credential only. It clears once a rotation is recorded on or after that date — the
# executor records it, or after a verified rotation run
#   node dist/cli/security-drift-cli.js record-rotation --cred <id> --date <YYYY-MM-DD | now>
# (refused for revoke-no-replacement credentials: the executor records revokes).
# Remove the key afterwards to keep the file tidy (leaving it is harmless).

version = 1

# Staging convention for reissued values: Devon parks the NEW provider-minted value
# in the login Keychain item service="cred-rotation", account="<credential id>",
# typed in a real Terminal (TTY prompt, never via `!`):
#   security add-generic-password -U -s cred-rotation -a <id> -T /usr/bin/security -w
# The 4am executor consumes it from there (store → deploy → verify → revoke-confirm)
# and deletes the staging item once the old credential is confirmed dead.

