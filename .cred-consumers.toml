# secret write on Ops / Platform. Read by src/cli/change-mgr-cli.ts credRotationBwsToken();
# overridable by the BWS_CRED_ROTATION_TOKEN env var. Absent => executor rotations block.
# Created date = the Keychain item's creation (2026-07-02T22:44Z), the same evening as #33.
[[credential]]
id = "bws-cred-rotation-token"
class = "bws-machine-token"
fingerprint_sha256_8 = "0f0b60a2"
provider = "bitwarden-sm"
provider_identity = "Bitwarden SM cred-rotation machine account (read+write, Ops / Platform), access-key 9a597098-…"
created = "2026-07-02"
disposition = "reissue"

  [[credential.consumer]]
  kind = "keychain"
  service = "Claude"
  account = "BWS_ACCESS_TOKEN_CRED_ROTATION"
  note = "change-mgr-cli.ts: the 04:00 rotation executor's bws child processes only"

# The brains token: read-only on BWS project "brains". Created 2026-07-02 (the Keychain item's
# creation). No reader was found by name across the portfolio, launchd and ~/.claude
# (2026-10-21 and 2026-10-22); Devon keeps it (2026-10-22), and it is the first BWS machine
# token the rotation executor's Keychain instance rotates (orchestrator ADR-0055 amendment 12).
# A machine token has no BWS copy of itself, so its keeper is its one Keychain item.
[[credential]]
id = "bws-tok-brain-ops"
class = "bws-machine-token"
fingerprint_sha256_8 = "4e19e90a"
provider = "bitwarden-sm"
provider_identity = "Bitwarden SM machine account reading project brains"
created = "2026-10-22"
disposition = "reissue"
keeper_service = "Claude"
keeper_account = "BWS_ACCESS_TOKEN_BRAIN_OPS"
# Handed to the SDS (Devon, 2026-10-22): the rotation executor's Keychain instance rotates it
# (orchestrator ADR-0055 amendment 12). Rotated by it 2026-10-22, the first BWS machine-token
# rotation (units 718d9650, 90fe056e and b0f5832a): new value sha256 4e19e90a, old ecad842e proved
# refused after the 75-minute window; request cleared.
rotated_by_sds = true

  [[credential.consumer]]
  kind = "keychain"
  service = "Claude"
  account = "BWS_ACCESS_TOKEN_BRAIN_OPS"
  note = "no reader found; the keeper itself"

# ── Porkbun API key pair (infraops Porkbun gateway) ─────────────────────────────
# The API key and secret API key are one credential: Porkbun issues and revokes them together
# at porkbun.com/account/api. Minted 2026-10-29 for the gateway; start.sh is the only reader.
# Manual lane (class porkbun-api-key): create and revoke are Devon console actions. The
# fingerprint is the API key's; the secret API key travels with it.
[[credential]]
id = "porkbun-api-keypair"
class = "porkbun-api-key"
fingerprint_sha256_8 = "b7939409"
provider = "porkbun"
provider_identity = "Porkbun account API key + secret API key (porkbun.com/account/api)"
bws_uuid = "27e165db-5d54-4176-94df-b4f201476bed"
created = "2026-10-29"
consumers_verified = "2026-10-29"
verified_by = "manual: key newly minted for the gateway; sole reader is start.sh (repo grep, BWS fingerprints read in-process)"
disposition = "reissue"

  [[credential.consumer]]
  kind = "bws-secret"
  uuid = "27e165db-5d54-4176-94df-b4f201476bed"
  note = "porkbun-api-key (Ops / Platform) — PORKBUN_API_KEY"

  [[credential.consumer]]
  kind = "bws-secret"
  uuid = "28acc253-51e3-4ee1-8a04-b4f2014782fe"
  note = "porkbun-secret-key (Ops / Platform) — PORKBUN_SECRET_API_KEY"

  [[credential.consumer]]
  kind = "runtime-fetch"
  repo = "infraops-mcp-server"
  ref = "start.sh"
  note = "fetches both secrets by UUID at launch and exports them to the gateway"
